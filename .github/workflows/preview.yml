# Publishes the reviewer's copy of /digest/2026-10-28 to GitHub Pages (plan § 3, § 4).
# The page is rendered here and uploaded as a Pages artifact, so the preview is never
# committed (ADR 0003). The lane marker comes from the repo variable LANE_MARKER;
# with the variable unset, the banner reads "no marker set" (§ 4: upload over the same link).
name: Preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Save /digest/2026-10-28 as one HTML file
        env:
          LANE_MARKER: ${{ vars.LANE_MARKER }}
        run: |
          printf 'LANE_ID=lane-07\nLANE_MARKER=%s\nPORT=8787\n' "$LANE_MARKER" > .env
          pnpm start > rig.log 2>&1 &
          for i in $(seq 30); do curl -fsS http://localhost:8787/health >/dev/null && break; sleep 1; done
          mkdir -p _site
          curl -fsS http://localhost:8787/digest/2026-10-28 -o _site/index.html
          grep -q '<table' _site/index.html
          # Say only whether a marker is set: the log is public, the marker must come off later (ADR 0003).
          if grep -q 'class="marker">no marker set<' _site/index.html; then echo "banner: no marker set"; else echo "banner: marker set"; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
